name: Static site

# Builds the static marketing site and deploys it to Cloudflare Pages
# (project butwal-hacks-site; canonical https://www.butwalhacks.com, the apex
# forwards to www at the registrar). Data pages (events, gallery, chapters,
# blog) are rendered at build time from Supabase, so this is how they update:
#   - every push to main (code and copy changes),
#   - on demand: Actions → Static site → Run workflow, after content edits
#     made in the app.
# GitHub Actions is free for public repositories; a run takes ~5 minutes.
#
# Never runs on pull_request: the build reads Supabase with the service-role
# key, and this repository is public.
#
# With the repository variable STATIC_SITE_TARGET=production it deploys the
# production branch (main); otherwise the noindexed preview branch. See
# docs/CLOUDFLARE.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: static-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    if: github.repository == 'Prarambha369/Butwal-Hacks'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET: ${{ vars.STATIC_SITE_TARGET == 'production' && 'production' || 'preview' }}
    steps:
      - name: Check secrets
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or SUPABASE_SERVICE_ROLE_KEY is not set; skipping (owner action, see docs/CLOUDFLARE.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4.4.0
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - uses: actions/cache@v4
        if: steps.check.outputs.ready == 'true'
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - if: steps.check.outputs.ready == 'true'
        run: npm install

      - name: Build static site
        if: steps.check.outputs.ready == 'true'
        working-directory: my-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
        run: |
          if [ "$TARGET" = "production" ]; then
            node scripts/build-static.mjs --site-url https://www.butwalhacks.com
          else
            node scripts/build-static.mjs --noindex --site-url https://preview.butwal-hacks-site.pages.dev
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        working-directory: my-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BRANCH=preview
          if [ "$TARGET" = "production" ]; then BRANCH=main; fi
          npx wrangler pages deploy ../.static-build/out \
            --project-name butwal-hacks-site \
            --branch "$BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "${GITHUB_SHA::7} (${{ github.event_name }})"
