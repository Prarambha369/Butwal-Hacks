name: Deploy

on:
  push:
    branches: [main]

# Let main pushes run to completion; cancel any in-progress deploy for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  seed-embeddings:
    name: Seed Embeddings
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - run: npm ci --legacy-peer-deps

      - name: Seed knowledge embeddings
        run: npx tsx scripts/seed-embeddings.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}

  vercel-deploy:
    name: Vercel Deploy
    needs: seed-embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "WARNING: VERCEL_DEPLOY_HOOK_URL not set. Skipping deployment."
            exit 0
          fi
          echo "Triggering Vercel deployment..."
          curl -X POST -s -o /dev/null -w "HTTP %{http_code}" "$VERCEL_DEPLOY_HOOK_URL"
          echo ""
          echo "Deployment triggered."
