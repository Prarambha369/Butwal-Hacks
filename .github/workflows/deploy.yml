name: Deploy

on:
  push:
    branches: [main]
  # Manual runs make a failed migration recoverable without a dummy commit.
  workflow_dispatch:

# Let main pushes run to completion; cancel any in-progress deploy for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Verify ────────────────────────────────────────────────────────────
  # Nothing ran tests, lint, or typecheck in CI before this. That is why a
  # nested-button hydration break, a duplicated revalidatePath, and swallowed
  # Supabase errors could all reach main unnoticed.
  verify:
    name: Verify (typecheck, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          # Caches the resolved tree, not npm's download cache. Measured on this
          # repo: cold install 34s, npm-cache-warm 28s, node_modules-warm 3s.
          # `cache: npm` would only buy the 6s middle number.
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # ─── Migrate ───────────────────────────────────────────────────────────
  # MUST NOT exit 0 when the secret is missing. The previous version logged a
  # warning and continued, so the pipeline went green while shipping code
  # against a schema that had never been migrated. A green build has to mean
  # the migrations actually ran.
  migrate:
    name: Database Migration
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # The migrations live at the repo root, not under my-app, so this job
      # must NOT inherit the `my-app` working-directory the verify job sets.
      # `supabase db push` reads <cwd>/supabase/migrations, and running it from
      # my-app/ would find no migrations at all -- a green run that applied
      # nothing. Assert the directory is present and non-empty before trusting
      # the push.
      - name: Locate migrations
        run: |
          set -euo pipefail
          count=$(find supabase/migrations -maxdepth 1 -name '*.sql' 2>/dev/null | wc -l)
          echo "Found $count migration(s) in supabase/migrations"
          if [ "$count" -eq 0 ]; then
            echo "::error::No migrations found at supabase/migrations. Refusing to report success."
            echo "This step runs from the repo root on purpose -- if you moved the"
            echo "migrations under my-app/, fix the working-directory instead."
            exit 1
          fi

      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::SUPABASE_DB_URL is not set. Refusing to report success with unapplied migrations."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # Supabase prints a generic "setting the env var correctly" hint on
          # every failure mode, which buries the real one. Echo the host (never
          # the password) so an auth failure is distinguishable from a
          # reachability failure at a glance.
          echo "::group::connection"
          echo "host: $(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^[^@]*@([^:/?]+).*#\1#')"
          echo "port: $(printf '%s' "$SUPABASE_DB_URL" | sed -E 's#^[^@]*@[^:/?]+:([0-9]+).*#\1#')"
          echo "::endgroup::"
          echo "::notice::Migrations need a direct or session-pooler connection."
          echo "::notice::The transaction pooler (port 6543) cannot run DDL."
          supabase db push --db-url "$SUPABASE_DB_URL"

  # ─── Deploy ────────────────────────────────────────────────────────────
  # Without the hook this workflow accomplishes nothing, so a green result
  # would be actively misleading.
  vercel-deploy:
    name: Vercel Deploy
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${VERCEL_DEPLOY_HOOK_URL}" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_URL is not set. Nothing was deployed."
            exit 1
          fi
          echo "Triggering Vercel deployment..."
          code="$(curl -X POST -s -o /dev/null -w '%{http_code}' "$VERCEL_DEPLOY_HOOK_URL")"
          echo "HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Deploy hook returned HTTP $code"
            exit 1
          fi
          echo "Deployment triggered."
