name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress PR runs; let main pushes complete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Lint
        run: npm run lint

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: npm Audit
        run: npm audit --legacy-peer-deps --audit-level=high

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit

  build:
    name: Build
    needs: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps

      - name: Check for secrets
        id: check-secrets
        env:
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          if [ -z "$AUTH0_SECRET" ] || [ -z "$SUPABASE_URL" ]; then
            echo "secrets_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "secrets_available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check-secrets.outputs.secrets_available == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          AUTH0_BASE_URL: http://localhost:3000
          APP_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: https://butwalhacks.com
          AUTH0_M2M_CLIENT_ID: ${{ secrets.AUTH0_M2M_CLIENT_ID }}
          AUTH0_M2M_CLIENT_SECRET: ${{ secrets.AUTH0_M2M_CLIENT_SECRET }}

      - name: Skip build notice
        if: steps.check-secrets.outputs.secrets_available != 'true'
        run: 'echo "WARNING: Secrets missing. Skipping build step."'

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Tests
        run: npx vitest run

  secrets-audit:
    name: Secrets Audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm install --legacy-peer-deps
        working-directory: my-app
      - name: Audit for leaked secrets
        run: node .github/actions/secrets-audit/audit.mjs

  auth0-m2m-verify:
    name: Auth0 M2M Verify
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: my-app
      - name: Verify M2M Management API access
        run: node ../scripts/verify-auth0-m2m.mjs
        working-directory: my-app
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_M2M_CLIENT_ID: ${{ secrets.AUTH0_M2M_CLIENT_ID }}
          AUTH0_M2M_CLIENT_SECRET: ${{ secrets.AUTH0_M2M_CLIENT_SECRET }}
          AUTH0_MANAGEMENT_API_AUDIENCE: ${{ secrets.AUTH0_MANAGEMENT_API_AUDIENCE }}

  ai-review:
    name: AI Review
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          DIFF=$(git diff origin/main...HEAD -- . ':!.github' ':!*.md' ':!package-lock.json')
          DIFF=$(echo "$DIFF" | head -c 100000)
          echo "diff<<DIFF_EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "DIFF_EOF" >> $GITHUB_OUTPUT

      - run: npm install --legacy-peer-deps
        working-directory: my-app
      - name: AI Code Review
        if: steps.diff.outputs.diff != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_DIFF: ${{ steps.diff.outputs.diff }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/actions/ai-review/review.mjs "$PR_DIFF" "$PR_TITLE" "$PR_BODY" "$PR_NUMBER"

  ponytail-audit:
    name: Ponytail Audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: npm install --legacy-peer-deps
        working-directory: my-app
      - name: Check for dead code
        run: node .github/actions/ponytail-audit/audit.mjs

  content-seed:
    name: Content Embeddings
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if content.ts changed
        id: changed
        run: |
          CHANGED=$(git diff --name-only ${{ github.event.before }} HEAD | grep -c 'my-app/src/lib/content.ts' || true)
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4.4.0
        if: steps.changed.outputs.changed != '0'
        with:
          node-version: 22

      - run: npm install --legacy-peer-deps
        if: steps.changed.outputs.changed != '0'

      - name: Seed knowledge embeddings
        if: steps.changed.outputs.changed != '0'
        run: npx tsx scripts/seed-embeddings.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}

  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: npx playwright test
        env:
          AUTH0_TEST_EMAIL: ${{ secrets.AUTH0_TEST_EMAIL }}
          AUTH0_TEST_PASSWORD: ${{ secrets.AUTH0_TEST_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          AUTH0_SECRET: ${{ secrets.AUTH0_SECRET }}
          AUTH0_BASE_URL: http://localhost:3000
          APP_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: https://butwalhacks.com

  quality-gate:
    name: Quality Gate
    needs: [lint, typecheck, build, test, security-audit, secrets-audit]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "All quality checks passed."
