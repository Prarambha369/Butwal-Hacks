name: Feature Request
description: Suggest an improvement or a new feature for Butwal Hacks
title: "[FEATURE]: "
labels: ["enhancement", "help-wanted"]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! Please check existing issues first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: The Problem
      description: What problem does this solve? Who does it help?
      placeholder: It's frustrating when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see built?
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What workarounds or alternative solutions have you considered?
      placeholder: I've tried...

  - type: textarea
    id: ux
    attributes:
      label: UX / Design Thoughts
      description: Any ideas on how this should look or feel? Links to inspirations welcome.
      placeholder: This should feel like...

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which area does this affect?
      multiple: true
      options:
        - Public pages (home, blog, events)
        - Hacker ID / ORCID profile
        - Dashboard (hacker / organizer / maintainer)
        - API / Backend
        - Authentication / Security
        - Infrastructure / CI / Deploy
        - Documentation
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links, screenshots, or references that support this feature.
