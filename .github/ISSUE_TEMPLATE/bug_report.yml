name: 🐛 Bug Report
description: Create a report to help us fix a problem in the codebase
title: "[BUG]: "
labels: ["bug", "priority:medium"]
projects: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please be as detailed as possible.

  - type: textarea
    id: description
    attributes:
      label: The Problem
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: If applicable, add screenshots, console logs, or network tab captures.
      placeholder: Drag & drop images or paste logs here.

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g., macOS 14.5, Windows 11, Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g., Chrome 126, Firefox 128, Safari 17
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App Version
      description: Check the footer of the app or the latest deploy SHA.
      placeholder: e.g., v2.0.1 or commit 7a3f1e9

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant details (network conditions, user role, etc.).
