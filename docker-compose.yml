# ═══════════════════════════════════════════════════════════════════
# Butwal Hacks — Local Development Stack
# ═══════════════════════════════════════════════════════════════════
# Starts Supabase (PostgreSQL + Studio) and Redis locally.
#
# Usage:
#   docker compose up -d          # Start services
#   docker compose down           # Stop services
#   docker compose logs -f        # Follow logs
#
# After starting, update .env.local:
#   NEXT_PUBLIC_SUPABASE_URL=http://localhost:3000 (points to PostgREST REST API)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY=<see docker compose logs>
#   UPSTASH_REDIS_REST_URL= (not used locally — Redis is TCP only, caching disabled)
# ═══════════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL (Supabase backend) ───────────────────────────────
  db:
    image: supabase/postgres:15.1.0
    container_name: bh-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: butwal_hacks
    volumes:
      - bh-pg-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Supabase Studio (Dashboard UI) ──────────────────────────────
  studio:
    image: supabase/studio:latest
    container_name: bh-studio
    ports:
      - "54321:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      SUPABASE_URL: http://localhost:54321
      # Keys from supabase/.env.local (generated by `supabase init`)
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
    depends_on:
      db:
        condition: service_healthy

  # ── PostgREST (Supabase REST API) ──────────────────────────────
  rest:
    image: postgrest/postgrest:v12.0.2
    container_name: bh-rest
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/butwal_hacks
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    depends_on:
      db:
        condition: service_healthy

  # ── PostgREST Meta (Supabase API proxy) ────────────────────────
  meta:
    image: supabase/postgres-meta:v0.8.0
    container_name: bh-meta
    ports:
      - "8080:8080"
    environment:
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: butwal_hacks
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

  # ── Redis (Rate limiting + cache) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bh-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - bh-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bh-pg-data:
  bh-redis-data:
