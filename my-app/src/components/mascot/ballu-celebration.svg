<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" width="384" height="384" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="c-body-grad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="26%" stop-color="#FE7C7C"/>
      <stop offset="60%" stop-color="#FE0000"/>
      <stop offset="100%" stop-color="#B10000"/>
    </radialGradient>
    <radialGradient id="c-belly-grad" cx="50%" cy="52%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F2F2F2"/>
      <stop offset="100%" stop-color="#D7D7D7"/>
    </radialGradient>
  </defs>

  <!-- back shaggy tuft clumps -->
  <g fill="#1A1A1A">
    <path d="M158 74c-6 -8 -3 -18 5 -18c7 0 13 -4 13 -11c0 -4 4 -9 9 -10c11 -3 13 7 11 17c-3 14 -9 24 -21 18c-7 -4 -1 -17 4 -17z"/>
    <path d="M226 74c6 -8 3 -18 -5 -18c-7 0 -13 -4 -13 -11c0 -4 -4 -9 -9 -10c-11 -3 -13 7 -11 17c3 14 9 24 21 18c7 -4 1 -17 -4 -17z"/>
    <path d="M98 150c-9 -2 -22 -1 -34 -11c-12 -12 -20 -30 -18 -52c3 -22 17 -40 34 -42c17 -1 29 9 33 24c4 16 1 30 -7 41c-7 10 -14 20 -28 29z"/>
    <path d="M286 150c9 -2 22 -1 34 -11c12 -12 20 -30 18 -52c-3 -22 -17 -40 -34 -42c-17 -1 -29 9 -33 24c-4 16 -1 30 7 41c7 10 14 20 28 29z"/>
    <path d="M120 232c-4 -6 3 -12 11 -12c7 -1 13 3 13 9c0 6 -2 10 -7 10c-4 0 -10 1 -13 3c-4 5 -9 9 -13 9c7 -1 13 -4 17 -8z" opacity="0.8"/>
    <path d="M264 232c4 -6 -3 -12 -11 -12c-7 -1 -13 3 -13 9c0 6 2 10 7 10c4 0 10 1 13 3c4 5 9 9 13 9c-7 -1 -13 -4 -17 -8z" opacity="0.8"/>
  </g>

  <!-- main body -->
  <g>
    <!-- lower body -->
    <ellipse cx="192" cy="258" rx="110" ry="86" fill="url(#c-body-grad)"/>
    <!-- head -->
    <circle cx="192" cy="126" r="66" fill="url(#c-body-grad)"/>
    <!-- snout -->
    <ellipse cx="192" cy="152" rx="38" ry="26" fill="url(#c-body-grad)"/>
    <!-- ears -->
    <circle cx="142" cy="88" r="20" fill="url(#c-body-grad)"/>
    <circle cx="242" cy="88" r="20" fill="url(#c-body-grad)"/>
    <!-- crown tuft -->
    <path d="M192 62c-7 -8 2 -18 12 -16c11 2 17 9 16 18c-1 14 -8 19 -16 21c-8 2 -12 -1 -12 -23z" fill="url(#c-body-grad)"/>

    <!-- dark shading -->
    <g fill="#7B0000" opacity="0.55">
      <path d="M150 92c-18 -3 -32 7 -31 25c2 -6 5 -11 10 -13c4 -1 13 1 19 2c4 -15 16 -25 32 -23c6 -3 1 -16 -10 -11z"/>
      <path d="M234 92c18 -3 32 7 31 25c-2 -6 -5 -11 -10 -13c-4 -1 -13 1 -19 2c-4 -15 -16 -25 -32 -23c-6 -3 -1 -16 10 -11z"/>
      <path d="M126 204c-2 -6 3 -12 11 -12c13 -1 22 -9 23 -21c2 -16 -5 -28 -14 -34c-21 -12 -38 -8 -44 5c-1 2 -1 5 -1 8c-1 5 0 11 3 16c-7 20 4 44 21 51z"/>
      <path d="M258 204c2 -6 -3 -12 -11 -12c-13 -1 -22 -9 -23 -21c-2 -16 5 -28 14 -34c21 -12 38 -8 44 5c1 2 1 5 1 8c1 5 0 11 -3 16c7 20 -4 44 -21 51z"/>
    </g>

    <!-- belly/chest -->
    <ellipse cx="192" cy="266" rx="68" ry="48" fill="url(#c-belly-grad)"/>
    <!-- chest badge -->
    <circle cx="192" cy="232" r="19" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="192" cy="232" r="14" fill="#FE0000" opacity="0.95"/>
    <text x="192" y="238" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">bh</text>

    <!-- ears inner -->
    <circle cx="142" cy="88" r="11" fill="#4A4A4A"/>
    <circle cx="242" cy="88" r="11" fill="#4A4A4A"/>

    <!-- face: happy open-mouth grin -->
    <g>
      <ellipse cx="168" cy="118" rx="9" ry="8" fill="#1A1A1A"/>
      <ellipse cx="216" cy="118" rx="9" ry="8" fill="#1A1A1A"/>
      <circle cx="168" cy="119" r="5.5" fill="#FFFFFF"/>
      <circle cx="216" cy="119" r="5.5" fill="#FFFFFF"/>
      <circle cx="169" cy="120" r="3" fill="#1A1A1A"/>
      <circle cx="217" cy="120" r="3" fill="#1A1A1A"/>
      <circle cx="167.5" cy="118" r="1.1" fill="#FFFFFF"/>
      <circle cx="215.5" cy="118" r="1.1" fill="#FFFFFF"/>
      <!-- happy raised eyebrows -->
      <path d="M156 110c3 -3 11 -3 14 0c2 -3 8 -3 11 0c-2 -4 -11 -3 -17 1c-3 -5 -15 -3 -14 -2z" fill="#2A2A2A"/>
      <path d="M226 110c-3 -3 -11 -3 -14 0c-2 -3 -8 -3 -11 0c2 -4 11 -3 17 1c3 -5 15 -3 14 -2z" fill="#2A2A2A"/>
      <!-- nose -->
      <ellipse cx="192" cy="142" rx="7" ry="5" fill="#1A1A1A"/>
      <ellipse cx="190" cy="140" rx="2" ry="1.1" fill="#FFFFFF" opacity="0.55"/>
      <!-- open mouth smile -->
      <path d="M176 152c3 6 13 8 16 8s13 -2 16 -8" fill="none" stroke="#1A1A1A" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M172 154c6 8 16 11 20 11s14 -3 20 -11" fill="none" stroke="#2A2A2A" stroke-width="1.4" opacity="0.4"/>
      <!-- open mouth interior hint -->
      <ellipse cx="192" cy="155" rx="9" ry="4" fill="#7B0000" opacity="0.5"/>
      <!-- cheek blush -->
      <ellipse cx="150" cy="135" rx="9" ry="5" fill="#FFB3B3" opacity="0.55"/>
      <ellipse cx="234" cy="135" rx="9" ry="5" fill="#FFB3B3" opacity="0.55"/>
    </g>

    <!-- ARMS UP -->
    <g>
      <!-- left arm raised -->
      <path d="M132 210c-10 -12 -12 -26 -8 -38c4 -13 14 -21 24 -22c7 -1 9 -7 7 -12c-1 -5 -6 -8 -12 -7c-9 1 -16 7 -16 15c0 5 1 8 1 9c7 1 14 4 18 9c7 5 11 12 9 19z" fill="url(#c-body-grad)"/>
      <!-- RIGHT arm raised -->
      <path d="M252 210c10 -12 12 -26 8 -38c-4 -13 -14 -21 -24 -22c-7 -1 -9 -7 -7 -12c1 -5 6 -8 12 -7c9 1 16 7 16 15c0 5 -1 8 -1 9c-7 1 -14 4 -18 9c-7 5 -11 12 -9 19z" fill="url(#c-body-grad)"/>
      <!-- left paw up -->
      <g transform="translate(116 138)">
        <circle cx="0" cy="0" r="16" fill="url(#c-body-grad)"/>
        <circle cx="-7" cy="-4" r="3.4" fill="#FFFFFF" opacity="0.85"/>
        <circle cx="0" cy="-7" r="3.4" fill="#FFFFFF" opacity="0.85"/>
        <circle cx="7" cy="-4" r="3.4" fill="#FFFFFF" opacity="0.85"/>
        <circle cx="-7" cy="-8" r="1.1" fill="#1A1A1A"/>
        <circle cx="0" cy="-11" r="1.1" fill="#1A1A1A"/>
        <circle cx="7" cy="-8" r="1.1" fill="#1A1A1A"/>
        <ellipse cx="0" cy="6" rx="8" ry="5" fill="#2A2A2A" opacity="0.6"/>
      </g>
      <!-- right paw up -->
      <g transform="translate(268 138)">
        <circle cx="0" cy="0" r="16" fill="url(#c-body-grad)"/>
        <circle cx="-7" cy="-4" r="3.4" fill="#FFFFFF" opacity="0.85"/>
        <circle cx="0" cy="-7" r="3.4" fill="#FFFFFF" opacity="0.85"/>
        <circle cx="7" cy="-4" r="3.4" fill="#FFFFFF" opacity="0.85"/>
        <circle cx="-7" cy="-8" r="1.1" fill="#1A1A1A"/>
        <circle cx="0" cy="-11" r="1.1" fill="#1A1A1A"/>
        <circle cx="7" cy="-8" r="1.1" fill="#1A1A1A"/>
        <ellipse cx="0" cy="6" rx="8" ry="5" fill="#2A2A2A" opacity="0.6"/>
      </g>
    </g>

    <!-- legs -->
    <g>
      <ellipse cx="158" cy="318" rx="24" ry="30" fill="url(#c-body-grad)"/>
      <ellipse cx="226" cy="318" rx="24" ry="30" fill="url(#c-body-grad)"/>
      <ellipse cx="158" cy="346" rx="11" ry="5" fill="#2A2A2A" opacity="0.6"/>
      <ellipse cx="226" cy="346" rx="11" ry="5" fill="#2A2A2A" opacity="0.6"/>
    </g>

    <!-- sparkles around the bear -->
    <g fill="#FFCF63">
      <path d="M92 120l2 -10 2 10 -5 3 -3 -7 -5 7 -3 -3 2 -10 2 10 -3 7 -5 -7 -3 3 2 10 -3 -7z" opacity="0.9"/>
      <path d="M292 120l2 -10 2 10 -5 3 -3 -7 -5 7 -3 -3 2 -10 2 10 -3 7 -5 -7 -3 3 2 10 -3 -7z" opacity="0.9"/>
      <path d="M130 70l1.5 -8 1.5 8 -4 2.5 -2.5 -5.5 -4 5.5 -2.5 -2.5 1.5 -8 1.5 8 -2.5 5.5 -4 -5.5 -2.5 2.5 1.5 8 -2.5 -5.5z" opacity="0.85"/>
      <path d="M254 66l1.5 -8 1.5 8 -4 2.5 -2.5 -5.5 -4 5.5 -2.5 -2.5 1.5 -8 1.5 8 -2.5 5.5 -4 -5.5 -2.5 2.5 1.5 8 -2.5 -5.5z" opacity="0.85"/>
      <path d="M70 200l1.5 -8 1.5 8 -4 2.5 -2.5 -5.5 -4 5.5 -2.5 -2.5 1.5 -8 1.5 8 -2.5 5.5 -4 -5.5 -2.5 2.5 1.5 8 -2.5 -5.5z" opacity="0.7"/>
      <path d="M314 200l1.5 -8 1.5 8 -4 2.5 -2.5 -5.5 -4 5.5 -2.5 -2.5 1.5 -8 1.5 8 -2.5 5.5 -4 -5.5 -2.5 2.5 1.5 8 -2.5 -5.5z" opacity="0.7"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="88" cy="94" r="2"/>
      <circle cx="296" cy="94" r="2"/>
      <circle cx="120" cy="50" r="1.6"/>
      <circle cx="264" cy="48" r="1.6"/>
    </g>

    <!-- ground shadow -->
    <ellipse cx="192" cy="360" rx="116" ry="9" fill="#000000" opacity="0.12"/>
  </g>
</svg>
